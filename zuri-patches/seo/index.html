    <!-- SERVICE WORKER CLEANUP: Runs on EVERY page load to ensure no stale SW/caches -->
    <!-- IMPORTANT: Preserves push worker (sw-push.js) so notification subscriptions persist -->
    <script>
      (async function () {
        try {
          // Unregister stale service workers, but KEEP push worker
          if ('serviceWorker' in navigator) {
            var regs = await navigator.serviceWorker.getRegistrations();
            var staleRegs = regs.filter(function (r) {
              var scriptUrl = (r.active && r.active.scriptURL) || (r.waiting && r.waiting.scriptURL) || (r.installing && r.installing.scriptURL) || '';
              return scriptUrl.indexOf('/sw-push.js') === -1;
            });

            await Promise.all(staleRegs.map(function(r) { return r.unregister(); }));
          }
        } catch (_) {}

        try {
          // Clear ALL Cache Storage entries
          if ('caches' in window) {
            var keys = await caches.keys();
            await Promise.all(keys.map(function(k) { return caches.delete(k); }));
          }
        } catch (_) {}
      })();
    </script>
